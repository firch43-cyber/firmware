#################################### Waveshare ESP32-S3-Touch-LCD-4.3B ##############################
; Waveshare ESP32-S3-Touch-LCD-4.3B (https://www.waveshare.com/esp32-s3-touch-lcd-4.3b.htm)
; Hardware: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB OPI PSRAM)
;           800x480 16-bit RGB parallel panel (ST7262-class) via ESP32-S3 LCD_CAM
;           GT911 capacitive touch over I2C, CH422G I2C IO-expander
; RGB panel:  DE=5, VSYNC=3, HSYNC=46, PCLK=7
;             R0-R4: 1,2,42,41,40 | G0-G5: 39,0,45,48,47,21 | B0-B4: 14,38,18,17,10
; Touch GT911: I2C SDA=8, SCL=9, INT=4 (direct GPIO), RST via CH422G EXIO1
; CH422G:     0x24 (mode) / 0x38 (output); EXIO1=TP_RST, EXIO2=DISP (backlight),
;             EXIO3=LCD_RST, EXIO4=SD_CS, EXIO5=USB_SEL
; SD Card SPI: SCK=12, MISO=13, MOSI=11, CS via CH422G EXIO4 (dummy GPIO6 for lib bookkeeping)
; Serial:     TX=43, RX=44
; Buttons:    BOOT button (GPIO0) only

[env:waveshare_43b]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/waveshare_43b>
build_flags =
	${env.build_flags}
	-Iboards/waveshare_43b
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDISABLE_ALL_LIBRARY_WARNINGS

	; ==================== Display: Arduino_GFX RGB panel backend ====================
	-DUSE_ARDUINO_GFX=1
	-DTFT_DATABUS_N=3
	-DTFT_DISPLAY_DRIVER_N=49
	-DTFT_WIDTH=800
	-DTFT_HEIGHT=480
	-DTFT_DE=5
	-DTFT_VSYNC=3
	-DTFT_HSYNC=46
	-DTFT_PCLK=7
	-DTFT_R0=1
	-DTFT_R1=2
	-DTFT_R2=42
	-DTFT_R3=41
	-DTFT_R4=40
	-DTFT_G0=39
	-DTFT_G1=0
	-DTFT_G2=45
	-DTFT_G3=48
	-DTFT_G4=47
	-DTFT_G5=21
	-DTFT_B0=14
	-DTFT_B1=38
	-DTFT_B2=18
	-DTFT_B3=17
	-DTFT_B4=10
	-DTFT_HSYNC_POL=0
	-DTFT_HSYNC_FRONT_PORCH=8
	-DTFT_HSYNC_PULSE_WIDTH=4
	-DTFT_HSYNC_BACK_PORCH=8
	-DTFT_VSYNC_POL=0
	-DTFT_VSYNC_FRONT_PORCH=8
	-DTFT_VSYNC_PULSE_WIDTH=4
	-DTFT_VSYNC_BACK_PORCH=8
	-DTFT_PCLK_ACTIVE_NEG=1
	-DTFT_PREF_SPEED=14000000
	; Bounce buffer: 24 scan lines of SRAM cache between the PSRAM framebuffer
	; and the LCD DMA. Prevents the tiled/torn image under PSRAM bus load
	; (WiFi+SD) and transient vertical slip on heavy full-screen redraws.
	; Pixel count; must stay a divisor of the panel height (480).
	-DTFT_RGB_BOUNCE_BUF_PX=19200
	-DROTATION=0
	; Font sizes scaled up for 800x480 (defaults target ~240px screens)
	-DFP=2
	-DFM=3
	-DFG=5

	; ==================== Touch: GT911 capacitive over I2C ====================
	; RST is on the CH422G expander (see interface.cpp reset_cb), not a GPIO.
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_GT911=1

	; ==================== CH422G IO-expander ====================
	-DCH422G_MODE_ADDR=0x24
	-DCH422G_OUT_ADDR=0x38
	-DCH422G_BIT_TP_RST=1
	-DCH422G_BIT_DISP=2
	-DCH422G_BIT_LCD_RST=3
	-DCH422G_BIT_SD_CS=4
	-DCH422G_BIT_USB_SEL=5

	; ==================== I2C ====================
	-DGROVE_SDA=8
	-DGROVE_SCL=9

	; ==================== Environment Flags ====================

	; Buttons - BOOT button (GPIO0) only on a bare board
	-DBTN_ALIAS='"Ok"'

	-DDEVICE_NAME='"Waveshare 4.3B"'
	-DUSB_as_HID=1

	; ==================== Library dependencies ====================
	; Arduino_GFX provides the RGB-panel backend selected by USE_ARDUINO_GFX
	; (required by lib/DisplayDrivers/src/backends/ardgfx.h).
lib_deps =
	${env.lib_deps}
	moononournation/GFX Library for Arduino@^1.6.9
